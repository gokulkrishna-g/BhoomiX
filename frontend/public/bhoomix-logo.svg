<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#022c22" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#011612" stop-opacity="1"/>
    </radialGradient>

    <!-- Emerald Leaf Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Golden Furrow Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- AI Tech Glow Cyan -->
    <linearGradient id="techGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="250" cy="250" r="235" fill="url(#bgGrad)" stroke="#10b981" stroke-width="6" stroke-opacity="0.6"/>
  
  <!-- Outer Tech Orbital Ring -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#techGrad)" stroke-width="3" stroke-dasharray="14 8" opacity="0.75"/>
  <circle cx="465" cy="250" r="7" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="35" cy="250" r="5" fill="#10b981" filter="url(#glow)"/>
  <circle cx="250" cy="35" r="6" fill="#f59e0b" filter="url(#glow)"/>

  <!-- Fertile Soil Furrows (Terracotta / Gold Arcs) -->
  <path d="M 120 320 C 180 390, 320 390, 380 320 C 340 370, 200 370, 120 320 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <path d="M 145 345 C 195 400, 305 400, 355 345 C 320 385, 215 385, 145 345 Z" fill="#b45309" opacity="0.7"/>

  <!-- Central Sprout / Crop Seedling (Tamil Nadu Agrarian Life) -->
  <!-- Left Sprout Leaf -->
  <path d="M 250 310 C 210 270, 150 250, 130 180 C 180 180, 230 220, 250 310 Z" fill="url(#emeraldGrad)" filter="url(#glow)"/>
  <!-- Right Sprout Leaf -->
  <path d="M 250 310 C 290 260, 350 240, 370 170 C 320 170, 270 210, 250 310 Z" fill="url(#emeraldGrad)"/>
  <!-- Center Sprout Shoot -->
  <path d="M 244 310 C 240 220, 245 150, 250 110 C 255 150, 260 220, 256 310 Z" fill="#6ee7b7"/>

  <!-- AI Decision Spark / Digital Nodes -->
  <circle cx="250" cy="110" r="9" fill="#fef08a" stroke="#f59e0b" stroke-width="2" filter="url(#glow)"/>
  <circle cx="130" cy="180" r="6" fill="#6ee7b7" filter="url(#glow)"/>
  <circle cx="370" cy="170" r="6" fill="#6ee7b7" filter="url(#glow)"/>

  <!-- Connecting AI Decision Synapse Lines -->
  <line x1="250" y1="110" x2="130" y2="180" stroke="#34d399" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="4 3"/>
  <line x1="250" y1="110" x2="370" y2="170" stroke="#34d399" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="4 3"/>

  <!-- Brand Wordmark: BhoomiX -->
  <text x="250" y="440" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    BHOOMI<tspan fill="#34d399">X</tspan>
  </text>
  <text x="250" y="468" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="3">
    SMART AI AGRI ECOSYSTEM
  </text>
</svg>
